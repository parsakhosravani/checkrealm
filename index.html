<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CheckRealm: grow a keep on a chessboard, raise an army of chess pieces, and take every rival keep with your queens.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CheckRealm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one-screen app. A ledger header (resources) on top, a scrolling work table in the middle,
   a tab rail at the foot. The Board tab swaps the table for a full-bleed isometric chessboard. */
:root{
  color-scheme:dark;
  --table:#17120e;      /* the room */
  --wood:#221a14;       /* header + rail */
  --panel:#2b221b;      /* cards */
  --panel-2:#352a21;    /* raised */
  --line:#4a3b2f;
  --maple:#e2cfa9;      /* light squares */
  --walnut:#6a4a33;     /* dark squares */
  --ink:#f2e8d5;
  --muted:#ab9a83;
  --brass:#d6a24a;
  --brass-hi:#f2ca78;
  --on-brass:#20160b;
  --bad:#e2715a;
  --good:#93c27a;
  --warn:#e7b752;
  --display:"IM Fell English SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--table);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px;border-radius:6px}
input,select{font:inherit;color:var(--ink);background:var(--table);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.svg-ic{display:inline-block;vertical-align:-3px;flex:none}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
.top{background:var(--wood);border-bottom:1px solid var(--line);padding-block:8px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;position:relative;z-index:5}
.top-row{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-family:var(--display);font-size:20px;color:var(--brass-hi);letter-spacing:.02em;white-space:nowrap}
.keep-btn{display:flex;align-items:center;gap:6px;min-width:0;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.keep-btn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.keep-btn small{color:var(--muted)}
.pace{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rc{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 5px;padding:5px 7px 7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;overflow:hidden}
.rc b{font-weight:800;font-size:15px}
.rc small{grid-column:1 / -1;font-size:11px;color:var(--muted);white-space:nowrap;line-height:1.1}
.rc small.neg{color:var(--bad)}
.rc .cap{position:absolute;left:0;bottom:0;height:3px;background:var(--brass);opacity:.7}
.rc .cap.full{background:var(--bad);opacity:1}
.alert{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:color-mix(in srgb,var(--bad) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 60%,transparent);text-align:left;font-weight:700;font-size:14px}
.alert.calm{background:var(--panel);border-color:var(--line);font-weight:500;color:var(--muted)}
.alert.calm .t{color:var(--ink)}
.alert .t{margin-left:auto;font-weight:800;white-space:nowrap}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

#view{flex:1;min-height:0;overflow-y:auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:22px}
#boardWrap{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at 50% 40%,#2a2019,var(--table) 70%)}
#boardWrap canvas{display:block;width:100%;height:100%;touch-action:none}
.board-tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;gap:8px}
.board-tools button{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:20px;font-weight:700;display:grid;place-items:center}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 80px)}
.legend span{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--table) 80%,transparent);border:1px solid var(--line);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.board-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--table) 80%,transparent);padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--wood);border-top:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{position:relative;display:grid;justify-items:center;gap:2px;padding:8px 0 9px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.tab[aria-current="true"]{color:var(--brass-hi)}
.tab[aria-current="true"]::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--brass-hi)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:17px;letter-spacing:0}

/* ---------- content ---------- */
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:23px;color:var(--brass-hi)}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;background:var(--brass);color:var(--on-brass);font-weight:800;letter-spacing:.01em;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--brass-hi)}
.btn:disabled{background:var(--panel-2);color:var(--muted)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--brass)}
.btn.danger{background:var(--bad);color:#1d0c07}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.wide{width:100%}
.bar{height:5px;border-radius:3px;background:var(--table);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);width:0}
.cost{display:flex;flex-wrap:wrap;gap:4px 12px;font-weight:700;font-size:14px}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost .short{color:var(--bad)}

.quest{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:linear-gradient(100deg,color-mix(in srgb,var(--brass) 16%,var(--panel)),var(--panel) 70%);border-color:color-mix(in srgb,var(--brass) 45%,var(--line))}
.quest .num{font-family:var(--display);font-size:30px;color:var(--brass-hi);line-height:1;width:38px;text-align:center}
.quest h3{font-size:18px}

.queue{display:grid;gap:10px}
.qitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.qitem .bar{grid-column:1 / -1}
.qitem .t{font-weight:800}
.qitem.wait{opacity:.65}

.town{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.tile:hover{border-color:var(--brass)}
.tile .ic{grid-row:span 2;width:40px;height:40px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center}
.tile b{font-weight:700;line-height:1.15}
.tile .st{font-size:12px;color:var(--muted)}
.tile .st.up{color:var(--brass-hi)}
.tile.zero .ic{opacity:.55}
.tile.locked{opacity:.55}

.fields{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.frow .fh{display:grid;gap:1px}
.frow .fh b{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 14%,var(--panel-2));position:relative}
.chip:hover{border-color:var(--c)}
.chip.busy{border-color:var(--brass-hi);box-shadow:inset 0 0 0 1px var(--brass-hi)}
.chip.busy::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--brass-hi)}
.chip.max{color:var(--brass-hi)}

.garrison{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.garrison .g{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px}
.garrison .g.zero{opacity:.4}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.unit{display:grid;gap:10px}
.unit.locked{opacity:.6}
.unit .head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.unit .pic{width:52px;height:52px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center}
.unit h3{font-size:20px}
.unit .have{font-size:22px;font-weight:800;color:var(--brass-hi)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
.stats div{background:var(--table);border-radius:6px;padding:4px 2px}
.stats b{display:block;font-size:15px}
.stats span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trainrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.trainrow input{width:100%;text-align:center;font-weight:800}

.moves{display:grid;gap:8px}
.mv{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);border-left-width:4px}
.mv.hostile{border-left-color:var(--bad)}
.mv.out{border-left-color:var(--brass)}
.mv.back{border-left-color:var(--good)}
.mv .bar{grid-column:1 / -1;margin-top:4px}
.mv .t{font-weight:800}

.reports{display:grid;gap:8px}
.rep{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);border-left:4px solid var(--good);overflow:hidden}
.rep.loss{border-left-color:var(--bad)}
.rep summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 13px;cursor:pointer}
.rep summary::-webkit-details-marker{display:none}
.rep summary b{font-weight:700}
.rep .unread{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brass-hi);margin-right:6px;vertical-align:1px}
.rep .body{padding:0 13px 13px;display:grid;gap:10px}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable th,.rtable td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line)}
.rtable th:first-child,.rtable td:first-child{text-align:left}
.rtable td.l{color:var(--bad)}
.tscroll{overflow-x:auto}

.stand{width:100%;border-collapse:collapse}
.stand td,.stand th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.stand th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stand td.n{text-align:right;font-weight:800}
.stand tr.me td{color:var(--brass-hi)}
.stand tr.dead td{opacity:.45;text-decoration:line-through}
.herald{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.herald li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.herald li.bad b{color:var(--bad)}
.qlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.qlist li{display:flex;gap:10px;align-items:center}
.qlist .ck{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.qlist li.done .ck{background:var(--good);border-color:var(--good);color:var(--on-brass)}
.qlist li.done{color:var(--muted)}
.qlist li.cur{color:var(--brass-hi);font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px;align-items:start}

/* ---------- sheet ---------- */
#sheetWrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(8,5,3,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--wood);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;animation:rise .18s ease-out}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:24px;border-radius:16px;border:1px solid var(--line);max-height:calc(100% - 48px)}}
@keyframes rise{from{translate:0 24px;opacity:.4}to{translate:0 0;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sh-head .pic{width:54px;height:54px;border-radius:12px;background:var(--panel);display:grid;place-items:center}
.sh-head h2{font-size:25px;color:var(--brass-hi);line-height:1.1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
.ranks{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:22px}
.ranks .arrow{color:var(--muted);font-family:var(--body)}
.req{display:flex;flex-wrap:wrap;gap:6px}
.req span{padding:3px 9px;border-radius:999px;font-size:13px;border:1px solid var(--line)}
.req .ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.req .no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.note{font-size:13px;color:var(--warn)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;background:var(--table);border:1px solid var(--line);border-radius:10px}
.seg button{flex:1;padding:8px 10px;border-radius:7px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel-2);color:var(--brass-hi);box-shadow:inset 0 0 0 1px var(--line)}
.sliders{display:grid;gap:12px}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sl input[type=range]{width:100%;accent-color:var(--brass);padding:0;border:0;background:none}
.sl output{font-weight:800;min-width:64px;text-align:right}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.summary div{background:var(--panel);border-radius:8px;padding:8px;text-align:center}
.summary b{display:block;font-size:17px}
.verdict{padding:10px 12px;border-radius:8px;font-weight:700;background:var(--panel)}
.verdict.good{color:var(--good)}
.verdict.bad{color:var(--bad)}
.verdict.mid{color:var(--warn)}
.keeplist{display:grid;gap:8px}
.keeplist button{display:grid;grid-template-columns:1fr auto;text-align:left;padding:12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.keeplist button.on{border-color:var(--brass)}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;display:grid;justify-items:center;gap:6px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{max-width:440px;padding:9px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);font-weight:700;font-size:14px;animation:rise .2s ease-out}
.toast.good{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.toast.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--panel-2))}

/* ---------- start + end ---------- */
.screen{position:fixed;inset:0;z-index:30;background:var(--table);overflow-y:auto}
.screen canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.95}
.screen .veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(23,18,14,0) 0%,rgba(23,18,14,.15) 30%,rgba(23,18,14,.9) 62%);pointer-events:none}
.start-inner{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-block:min(42vh,360px) 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start-card{width:100%;max-width:560px;margin:0 auto;display:grid;gap:16px}
.title{font-family:var(--display);font-size:clamp(52px,13vw,92px);line-height:.9;color:var(--brass-hi);text-shadow:0 2px 0 #000,0 0 30px rgba(214,162,74,.25);margin:0}
.tag{font-size:18px;color:var(--maple);margin:0;max-width:34ch}
.form{display:grid;gap:12px;background:color-mix(in srgb,var(--wood) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:16px}
.field{display:grid;gap:5px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px;color:var(--muted)}
.howto b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;font-weight:400}
.endbox{position:relative;min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.endbox .inner{display:grid;gap:14px;max-width:460px;justify-items:center}
.endbox h1{font-size:clamp(48px,12vw,80px);color:var(--brass-hi);line-height:.95}
.endbox.lose h1{color:var(--bad)}

@media (max-width:420px){
  .res{gap:4px}.rc{padding:5px 5px 7px;gap:3px}.rc b{font-size:13px}.rc small{font-size:10px}
  .brand{font-size:17px}.pace{display:none}
  .frow{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>


<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand">CheckRealm</div>
      <button class="keep-btn" id="keepBtn" data-act="keeps"></button>
      <div class="pace" id="pace"></div>
    </div>
    <div class="res" id="resbar"></div>
    <button class="alert" id="alert" hidden data-act="go" data-v="army"></button>
  </header>
  <main id="view"></main>
  <div id="boardWrap" hidden>

const BLD_ICON = {

const FIELD_LAYOUT = ['timberYard','timberYard','timberYard','timberYard','ivoryQuarry','ivoryQuarry','ivoryQuarry','ivoryQuarry','steelForge','steelForge','steelForge','steelForge','grainField','grainField','grainField','grainField'];

const FIELD_MAX = 10;
const LEVY = 6; // every keep yields this much of each resource per minute

const TOWN_ORDER = ['throne','warehouse','granary','barracks','ramparts','market','stable','siegeWorks','royalCourt'];
const TOWN = {

  warehouse:  { name: 'Warehouse',                     max: 12, cost: { timber: 130, ivory: 160, steel: 90, grain: 40 }, g: 1.42, t: 30, req: {}, desc: 'Holds timber, ivory and steel. Anything past the cap is lost.' },
  granary:    { name: 'Granary',                       max: 12, cost: { timber: 80, ivory: 100, steel: 70, grain: 20 },  g: 1.42, t: 25,  req: {}, desc: 'Holds grain between harvests.' },
  barracks:   { name: 'Barracks',      piece: 'pawn',  max: 10, cost: { timber: 210, ivory: 140, steel: 260, grain: 120 }, g: 1.42, t: 45, req: { throne: 1 }, desc: 'Drill ground for pawns, and bishops from rank 3. Higher ranks train faster.' },

  market:     { name: 'Market',                        max: 10, cost: { timber: 80, ivory: 70, steel: 120, grain: 70 },  g: 1.42, t: 35,  req: { throne: 3, warehouse: 1 }, desc: 'Trade a surplus for what you lack. Better rates each rank.' },
  stable:     { name: 'Knight Stable', piece: 'knight', max: 10, cost: { timber: 260, ivory: 140, steel: 220, grain: 100 }, g: 1.45, t: 60, req: { barracks: 3 }, desc: 'Where cavalry learns the L-shaped charge. Trains knights.' },
  siegeWorks: { name: 'Siege Works',   piece: 'rook',  max: 8,  cost: { timber: 460, ivory: 510, steel: 600, grain: 320 }, g: 1.5, t: 90,  req: { barracks: 5, throne: 5 }, desc: 'Builds rooks, the towers that break ramparts.' },
  royalCourt: { name: 'Royal Court',   piece: 'queen', max: 5,  cost: { timber: 1400, ivory: 1330, steel: 1585, grain: 1000 }, g: 1.6, t: 180, req: { throne: 6, stable: 3 }, desc: 'Trains queens, the only pieces that can take a keep.' },
};

const UNIT_IDS = ['pawn', 'bishop', 'knight', 'rook', 'queen'];
const UNITS = {
  pawn:   { name: 'Pawn',   type: 'inf', atk: 12, dI: 18, dC: 10, spd: 1.0, carry: 40, up: .25, time: 30,  cost: { timber: 60, ivory: 40, steel: 50, grain: 20 },   req: ['barracks', 1],   desc: 'Cheap line infantry. Numbers win the opening.' },
  bishop: { name: 'Bishop', type: 'inf', atk: 15, dI: 30, dC: 48, spd: 1.2, carry: 25, up: .35, time: 45,  cost: { timber: 80, ivory: 120, steel: 60, grain: 30 },  req: ['barracks', 3],   desc: 'Defensive specialist. Breaks cavalry charges.' },
  knight: { name: 'Knight', type: 'cav', atk: 45, dI: 22, dC: 14, spd: 2.2, carry: 90, up: .6,  time: 60,  cost: { timber: 130, ivory: 100, steel: 160, grain: 50 }, req: ['stable', 1],     desc: 'Fast raider that hauls the most loot. Weak at home.' },
  rook:   { name: 'Rook',   type: 'inf', atk: 60, dI: 35, dC: 35, spd: .6,  carry: 0,  up: 1,   time: 120, cost: { timber: 280, ivory: 220, steel: 260, grain: 70 }, req: ['siegeWorks', 1], desc: 'Siege tower. Every 3 that attack ignore a rampart rank, and survivors tear one down.' },
  queen:  { name: 'Queen',  type: 'inf', atk: 90, dI: 70, dC: 70, spd: .8,  carry: 0,  up: 3,   time: 300, cost: { timber: 900, ivory: 800, steel: 950, grain: 450 }, req: ['royalCourt', 1], desc: 'Each queen that survives a won attack shakes the keep’s loyalty. At zero, it is yours.' },
};

const RIVALS = [
  { name: 'Rank Legion',    keep: 'Rankhold',     color: '#c65b4a', per: 'warlord' },
  { name: 'House of Files', keep: 'Fileward',     color: '#5fa383', per: 'builder' },
  { name: 'Ivory Crown',    keep: 'Ivory Spire',  color: '#b4c2d6', per: 'turtle' },
  { name: 'En Passant',     keep: 'Passant Hall', color: '#a07bc0', per: 'warlord' },
  { name: 'Dark Squares',   keep: 'Umbra',        color: '#5d86b3', per: 'builder' },
];
const PERSONA = {
  warlord: { label: 'Warlord', aggr: 1.0,  build: { fields: 4, throne: 1.2, warehouse: 1, granary: 1, barracks: 3, stable: 3, siegeWorks: 1.6, royalCourt: 1.6, ramparts: .6, market: 0 }, mix: { pawn: 3, bishop: 1, knight: 4, rook: 1, queen: 1 } },
  builder: { label: 'Builder', aggr: .5,   build: { fields: 7, throne: 2, warehouse: 1.5, granary: 1.5, barracks: 1.2, stable: 1, siegeWorks: .8, royalCourt: 1.4, ramparts: 1, market: 0 }, mix: { pawn: 3, bishop: 2, knight: 2, rook: .6, queen: 1 } },
  turtle:  { label: 'Turtle',  aggr: .3,   build: { fields: 5, throne: 1.5, warehouse: 1.2, granary: 1.2, barracks: 2, stable: .6, siegeWorks: .4, royalCourt: 1, ramparts: 3, market: 0 }, mix: { pawn: 3, bishop: 5, knight: .6, rook: .3, queen: .6 } },
};
const DIFF = { easy: { mult: .9, label: 'Easy' }, normal: { mult: 1.15, label: 'Normal' }, hard: { mult: 1.45, label: 'Hard' } };
const PACE = { 1: 'Steady ×1', 3: 'Swift ×3', 8: 'Blitz ×8' };
const CAMP_TIERS = {
  1: { army: { pawn: 5 }, stash: 260 },
  2: { army: { pawn: 12, bishop: 3 }, stash: 650 },
  3: { army: { pawn: 24, bishop: 8, knight: 4 }, stash: 1400 },
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const uid = () => Math.random().toString(36).slice(2, 9);
const zeroRes = () => ({ timber: 0, ivory: 0, steel: 0, grain: 0 });
const zeroArmy = () => ({ pawn: 0, bishop: 0, knight: 0, rook: 0, queen: 0 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => { n = Math.floor(n); return n < 10000 ? n.toLocaleString('en-US') : n < 1e6 ? (n / 1000).toFixed(n < 1e5 ? 1 : 0) + 'k' : (n / 1e6).toFixed(1) + 'M'; };
const fmtT = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : m ? `${m}m ${String(r).padStart(2, '0')}s` : `${r}s`; };
const scaleRes = (c, m) => { const o = zeroRes(); RES.forEach(r => o[r] = Math.round((c[r] || 0) * m)); return o; };
const canPay = (have, c) => RES.every(r => have[r] >= (c[r] || 0));
const payRes = (have, c) => RES.forEach(r => have[r] -= (c[r] || 0));
const count = a => UNIT_IDS.reduce((s, u) => s + (a[u] || 0), 0);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* =========================================================
   RULES
   ========================================================= */
let S = null;           // game state
let SILENT = false;     // during offline catch-up
const capOf = l => Math.round(1500 * Math.pow(1.4, l));
const queueCap = t => 1 + (t >= 3 ? 1 : 0) + (t >= 6 ? 1 : 0);
const trainF = l => 1 / (1 + .07 * Math.max(0, l - 1));
const wallMul = l => 1 + .05 * l;
const wallFlat = l => Math.round(12 * Math.pow(l, 1.5));
const tradeRatio = l => Math.max(1.2, +(2.2 - .1 * l).toFixed(1));
const house = id => S.houses.find(h => h.id === id);
const keepById = id => S.keeps.find(k => k.id === id);
const campById = id => S.camps.find(c => c.id === id);
const isHumanKeep = k => k && k.owner === 'h0';
const humanKeeps = () => S.keeps.filter(isHumanKeep);
function hk() { const k = keepById(S.sel); if (isHumanKeep(k)) return k; const f = humanKeeps()[0]; if (f) S.sel = f.id; return f; }

const armyUp = a => UNIT_IDS.reduce((s, u) => s + (a[u] || 0) * UNITS[u].up, 0);
function armyAtk(a) { let inf = 0, cav = 0; UNIT_IDS.forEach(u => { const v = (a[u] || 0) * UNITS[u].atk; UNITS[u].type === 'cav' ? cav += v : inf += v; }); return { inf, cav, total: inf + cav }; }
const armyDef = (a, share) => UNIT_IDS.reduce((s, u) => s + (a[u] || 0) * (UNITS[u].dI * share + UNITS[u].dC * (1 - share)), 0);
const armyCarry = a => UNIT_IDS.reduce((s, u) => s + (a[u] || 0) * UNITS[u].carry, 0);
const slowest = a => { let m = Infinity; UNIT_IDS.forEach(u => { if (a[u] > 0) m = Math.min(m, UNITS[u].spd); }); return m === Infinity ? 1 : m; };
const travelSecs = (a, b, army) => Math.max(20, dist(a, b) / slowest(army) * 60);
const defenseOf = (k, share = .85) => (armyDef(k.army, share) + wallFlat(k.town.ramparts)) * wallMul(k.town.ramparts);

function fieldProd(k, r) { return LEVY + k.fields.reduce((s, f) => s + (FIELDS[f.type].res === r ? FIELD_PROD[f.l] : 0), 0); }
function upkeepOf(k) { let u = armyUp(k.army); for (const m of S.marches) if (m.from === k.id && m.owner === k.owner && m.kind !== 'move') u += armyUp(m.army); return u; }
function rates(k) {
  const mult = isHumanKeep(k) ? 1 : DIFF[S.diff].mult;
  const o = {}; RES.forEach(r => o[r] = fieldProd(k, r) * mult);
  o.grainGross = o.grain; o.upkeep = upkeepOf(k); o.grain -= o.upkeep;
  return o;
}
const capFor = (k, r) => capOf(r === 'grain' ? k.town.granary : k.town.warehouse);
const lvl = (k, kind, key) => kind === 'town' ? k.town[key] : k.fields[key].l;
const queuedCount = (k, kind, key) => k.bq.filter(j => j.kind === kind && j.key === key).length;
const nextLvl = (k, kind, key) => lvl(k, kind, key) + queuedCount(k, kind, key) + 1;
const maxLvl = (kind, key, k) => kind === 'town' ? TOWN[key].max : FIELD_MAX;
function jobCost(k, kind, key, to) {
  if (kind === 'town') return scaleRes(TOWN[key].cost, Math.pow(TOWN[key].g, to - 1));
  return scaleRes(FIELDS[k.fields[key].type].cost, Math.pow(1.52, to - 1));
}
function jobTime(k, kind, key, to) {
  const base = kind === 'town' ? TOWN[key].t * Math.pow(1.42, to - 1) : 18 * Math.pow(1.48, to - 1);
  return Math.round(base * (1 - .04 * k.town.throne));
}
function reqsMet(k, req) { return Object.entries(req).every(([b, l]) => k.town[b] >= l); }
const jobName = (k, j) => j.kind === 'town' ? TOWN[j.key].name : FIELDS[k.fields[j.key].type].name;

function checkBuild(k, kind, key) {
  const to = nextLvl(k, kind, key), max = maxLvl(kind, key);
  if (to > max) return { err: 'At maximum rank' };
  if (kind === 'town' && !reqsMet(k, TOWN[key].req)) return { err: 'Requirements not met' };
  if (k.bq.length >= queueCap(k.town.throne)) return { err: 'Build queue is full' };
  const cost = jobCost(k, kind, key, to);
  if (RES.some(r => cost[r] > capFor(k, r))) return { err: cost.grain > capFor(k, 'grain') ? 'Granary too small' : 'Warehouse too small', cost, to };
  if (!canPay(k.res, cost)) return { err: 'Not enough resources', cost, to, short: true };
  return { ok: true, cost, to };
}
function queueBuild(k, kind, key) {
  const c = checkBuild(k, kind, key); if (!c.ok) return c;
  payRes(k.res, c.cost);
  const dur = jobTime(k, kind, key, c.to);
  const start = k.bq.length ? k.bq[k.bq.length - 1].end : S.gt;
  k.bq.push({ kind, key, to: c.to, start, end: start + dur, cost: c.cost });
  return c;
}
function cancelLast(k) {
  const j = k.bq.pop(); if (!j) return;
  RES.forEach(r => k.res[r] = Math.min(capFor(k, r), k.res[r] + (j.start > S.gt ? j.cost[r] : Math.floor(j.cost[r] * .5))));
}

function unitLock(k, u) { const [b, l] = UNITS[u].req; return k.town[b] >= l ? null : `Needs ${TOWN[b].name} rank ${l}`; }
function train(k, u, n) {
  n = Math.floor(n); if (!(n >= 1)) return { err: 'Choose how many to train' };
  const lock = unitLock(k, u); if (lock) return { err: lock };
  if (k.tq.length >= 5) return { err: 'Training queue is full' };
  const cost = scaleRes(UNITS[u].cost, n);
  if (!canPay(k.res, cost)) return { err: 'Not enough resources' };
  payRes(k.res, cost);
  const per = UNITS[u].time * trainF(k.town[UNITS[u].req[0]]);
  k.tq.push({ u, n, total: n, per, next: k.tq.length ? null : S.gt + per });
  return { ok: true };
}
function maxTrain(k, u) { return Math.max(0, Math.min(...RES.map(r => Math.floor(k.res[r] / UNITS[u].cost[r])))); }

/* ---------- world creation ---------- */
function newKeep(name, owner, x, y, capital) {
  const town = {}; TOWN_ORDER.forEach(b => town[b] = 0); town.throne = 1;
  return { id: uid(), name, owner, x, y, capital, res: { timber: 750, ivory: 750, steel: 750, grain: 750 }, town,
    fields: FIELD_LAYOUT.map(type => ({ type, l: 1 })), army: zeroArmy(), bq: [], tq: [], loyalty: 100, starve: 0 };
}
function spots(n, minD, taken) {
  const out = [];
  for (let d = minD; out.length < n && d > .9; d -= .3) {
    for (let t = 0; t < 4000 && out.length < n; t++) {
      const p = { x: ri(0, N - 1), y: ri(0, N - 1) };
      if ([...taken, ...out].every(o => dist(o, p) >= d)) out.push(p);
    }
  }
  return out;
}
function makeWorld(o) {
  const houses = [{ id: 'h0', name: o.house || 'House Aurelian', color: '#e8b84f', human: true, wins: 0, alive: true }];
  const pool = RIVALS.slice().sort(() => Math.random() - .5).slice(0, o.rivals);
  pool.forEach((r, i) => houses.push({ id: 'h' + (i + 1), name: r.name, keepName: r.keep, color: r.color, per: r.per, human: false, wins: 0, alive: true, nextWar: rnd(60, 160) }));
  const pts = spots(houses.length, 4.2, []);
  const keeps = houses.map((h, i) => {

function notify(text, tone = '', snd = '', key = '') {

function affordIn(k, cost) {
  const rt = rates(k); let w = 0;
  for (const r of RES) { const need = (cost[r] || 0) - k.res[r]; if (need > 0) { if (rt[r] <= 0) return Infinity; w = Math.max(w, need / (rt[r] / 60)); } }
  return w / S.speed;
}
function effText(kind, key, l, k) {
  if (kind === 'field') return `+${fmt(FIELD_PROD[l] * S.speed)} ${RES_META[FIELDS[k.fields[key].type].res].name.toLowerCase()}/min`;
  switch (key) {
    case 'throne': return `${l * 4}% faster building · ${queueCap(l)} build slot${queueCap(l) > 1 ? 's' : ''}`;
    case 'warehouse': return `Holds ${fmt(capOf(l))} of each`;
    case 'granary': return `Holds ${fmt(capOf(l))} grain`;
    case 'barracks': return l ? `Pawns${l >= 3 ? ' and bishops' : ''} · ${Math.round((1 - trainF(l)) * 100)}% faster` : 'No infantry';
    case 'stable': return l ? `Knights · ${Math.round((1 - trainF(l)) * 100)}% faster` : 'No knights';
    case 'siegeWorks': return l ? `Rooks · ${Math.round((1 - trainF(l)) * 100)}% faster` : 'No rooks';
    case 'royalCourt': return l ? `Queens · ${Math.round((1 - trainF(l)) * 100)}% faster` : 'No queens';
    case 'ramparts': return `${fmt(wallFlat(l))} defense, +${l * 5}% to the garrison`;
    case 'market': return l ? `Trade at ${tradeRatio(l)} : 1` : 'No trading';
  }

  draw(time) {

    // shadow
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.moveTo(tx, ty + 30); c.lineTo(rx + 20, ry + 30); c.lineTo(bx, by + SLAB + 34); c.lineTo(lx - 20, ly + 30); c.closePath(); c.filter = 'blur(18px)'; c.fill(); c.filter = 'none';

    c.fillStyle = '#2c1d12'; c.beginPath(); c.moveTo(bx, by); c.lineTo(rx, ry); c.lineTo(rx, ry + SLAB); c.lineTo(bx, by + SLAB); c.closePath(); c.fill();

    // territory owners
    const owners = {};
    for (const k of st.keeps) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const x = k.x + dx, y = k.y + dy; if (x < 0 || y < 0 || x >= N || y >= N) continue; const key = x + ',' + y, d = Math.abs(dx) + Math.abs(dy); if (!owners[key] || owners[key].d > d) owners[key] = { d, color: st.houses.find(h => h.id === k.owner).color }; }
    // tiles
    for (let s = 0; s < 2 * N - 1; s++) for (let x = 0; x < N; x++) {
      const y = s - x; if (y < 0 || y >= N) continue;
      const [cx, cy] = pt(x, y), light = (x + y) % 2 === 0;
      c.beginPath(); c.moveTo(cx, cy - TH / 2); c.lineTo(cx + TW / 2, cy); c.lineTo(cx, cy + TH / 2); c.lineTo(cx - TW / 2, cy); c.closePath();

    for (let i = 0; i < N; i++) {

      c.strokeStyle = '#f2ca78'; c.lineWidth = 2.2; c.stroke();
    }
    // marches (lines)
    const gt = st.gt;
    for (const m of st.marches) {
      const [ax, ay] = pt(m.fx, m.fy), [bx3, by3] = pt(m.tx, m.ty);
      const hostile = m.owner !== 'h0' && m.kind !== 'return' && st.keeps.some(k => k.id === m.to && k.owner === 'h0');
      c.setLineDash([5, 6]); c.lineDashOffset = -time / 60; c.lineWidth = 1.6;
      c.strokeStyle = hostile ? 'rgba(226,113,90,.9)' : this.hexA(st.houses.find(h => h.id === m.owner).color, .65);

    const ents = [];
    for (const k of st.keeps) ents.push({ x: k.x, y: k.y, k });
    for (const cp of st.camps) ents.push({ x: cp.x, y: cp.y, cp });
    for (const m of st.marches) { const p = Math.max(0, Math.min(1, (gt - m.dep) / (m.arr - m.dep))); ents.push({ x: m.fx + (m.tx - m.fx) * p, y: m.fy + (m.ty - m.fy) * p, m }); }
    ents.sort((a, b) => (a.x + a.y) - (b.x + b.y));
    const hits = [];
    const toScreen = (wx, wy) => [(wx - this.cam.x) * z + W / 2, (wy - this.cam.y) * z + H / 2];
    for (const e of ents) {
      const [cx, cy] = pt(e.x, e.y);
      if (e.k) {
        const k = e.k, h = st.houses.find(h => h.id === k.owner), size = k.capital ? 46 : 40;
        const threatened = !this.demo && k.owner === 'h0' && st.marches.some(m => m.to === k.id && m.owner !== 'h0' && m.kind !== 'return');
        this.shadow(cx, cy, 15);
        if (threatened) { const r = 18 + (time / 40 % 14); c.strokeStyle = `rgba(226,113,90,${1 - (r - 18) / 14})`; c.lineWidth = 2; c.beginPath(); c.ellipse(cx, cy, r, r / 2, 0, 0, Math.PI * 2); c.stroke(); }
        if (k.owner === 'h0' && !this.demo) { c.strokeStyle = 'rgba(242,202,120,.9)'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(cx, cy, 16, 8, 0, 0, Math.PI * 2); c.stroke(); }
        this.piece(k.capital ? 'king' : 'rook', cx, cy + 3, size, h.color);
        if (z > .62 || this.demo) this.label(k.name, cx, cy + 15, h.color);
        const [s0x, s0y] = toScreen(cx - size * .35, cy - size * .9), [s1x, s1y] = toScreen(cx + size * .35, cy + 8);
        hits.push({ x0: s0x, y0: s0y, x1: s1x, y1: s1y, tx: k.x, ty: k.y });
      } else if (e.cp) {
        const cp = e.cp, empty = count(campArmy(cp)) === 0;
        this.shadow(cx, cy, 10);
        c.globalAlpha = empty ? .5 : 1;
        this.piece('pawn', cx, cy + 3, 30, '#9b8a74');
        c.globalAlpha = 1;
        c.fillStyle = '#f2ca78';
        for (let i = 0; i < cp.tier; i++) { c.beginPath(); c.arc(cx - (cp.tier - 1) * 3.5 + i * 7, cy + 11, 2.2, 0, Math.PI * 2); c.fill(); }
        const [s0x, s0y] = toScreen(cx - 12, cy - 28), [s1x, s1y] = toScreen(cx + 12, cy + 8);

      } else if (e.m) {
        const m = e.m, h = st.houses.find(h => h.id === m.owner), bob = Math.sin(time / 160 + m.dep) * 1.5;

  hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  shadow(x, y, r) { const c = this.ctx; c.fillStyle = 'rgba(20,10,4,.35)'; c.beginPath(); c.ellipse(x, y + 2, r, r / 2.2, 0, 0, Math.PI * 2); c.fill(); }

    const g = c.createLinearGradient(4, 0, 20, 0); g.addColorStop(0, shadeHex(color, .28)); g.addColorStop(.55, color); g.addColorStop(1, shadeHex(color, -.35));
    c.fillStyle = g; c.strokeStyle = 'rgba(18,10,4,.85)'; c.lineWidth = .8; c.lineJoin = 'round';

  label(text, x, y, color) {

}
const GB = new Board($('#boardCv'), () => S, false);
let DEMO = null;
const DB = new Board($('#demoCv'), () => DEMO, true);
function frame(t) {
  if (!$('#start').hidden) { DB.resize(); DB.draw(t); }
  else if (S && U.view === 'board' && !$('#app').hidden) { GB.resize(); GB.draw(t); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
new ResizeObserver(() => { GB.resize(); DB.resize(); DB.fit(); }).observe(document.body);

/* =========================================================
   START / END / LOOP
   ========================================================= */
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() { if (!S) return; S.real = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function renderStart() {
  const sv = loadSave(), f = U.form;
  const seg = (name, opts) => `<div class="seg">${opts.map(([v, l]) => `<button type="button" data-act="seg" data-name="${name}" data-val="${v}" class="${f[name] == v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  $('#startCard').innerHTML = `
    <div><h1 class="title">CheckRealm</h1><p class="tag">Grow a keep on an eleven-square board, raise an army of chess pieces, and take every rival keep with your queens.</p></div>
    ${sv && !sv.over ? `<div class="form"><div class="row"><div class="grow"><div class="label">Saved realm</div><b>${esc(sv.houses[0].name)}</b> <span class="muted small">· ${sv.keeps.filter(k => k.owner === 'h0').length} keep${sv.keeps.filter(k => k.owner === 'h0').length > 1 ? 's' : ''} · ${PACE[sv.speed]}</span></div><button class="btn" data-act="continue">Continue</button></div></div>` : ''}
    <form class="form" id="newForm">
      <div class="field2"><div class="field"><label for="f-house">House name</label><input id="f-house" maxlength="24" value="${esc(f.house || '')}" placeholder="House Aurelian"></div><div class="field"><label for="f-keep">First keep</label><input id="f-keep" maxlength="20" value="${esc(f.keep || '')}" placeholder="King’s Square"></div></div>
      <div class="field"><label>Rivals</label>${seg('rivals', [[2, '2 houses'], [3, '3'], [4, '4'], [5, '5']])}</div>
      <div class="field"><label>Rival strength</label>${seg('diff', [['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']])}</div>
      <div class="field"><label>Pace</label>${seg('pace', [[1, 'Steady ×1'], [3, 'Swift ×3'], [8, 'Blitz ×8']])}</div>
      <button class="btn wide" type="submit">${sv && !sv.over ? 'Found a new realm' : 'Found your realm'}</button>
      ${sv && !sv.over ? '<div class="small muted">Founding a new realm replaces the saved one.</div>' : ''}
    </form>
    <div class="howto"><div><b>Build</b>Raise fields for income, then barracks, stable and court.</div><div><b>Raid</b>Farm rogue camps for loot. Rivals will raid you after the truce.</div><div><b>Checkmate</b>Queens in a won attack drain loyalty. At zero the keep is yours.</div></div><a class="small muted" href="/classic.html" style="justify-self:start">Play the classic online version →</a>`;
  $('#newForm').onsubmit = e => { e.preventDefault(); beginGame(); };
}
function showStart() {
  $('#app').hidden = true; $('#end').hidden = true; closeSheet();
  DEMO = makeWorld({ house: 'Demo', rivals: 5, diff: 'normal', pace: 1 });
  DEMO.keeps.forEach(k => { k.army.pawn = 20; });
  for (let i = 0; i < 4; i++) { const a = DEMO.keeps[i + 1], b = DEMO.camps[i]; if (a && b) DEMO.marches.push({ id: 'd' + i, owner: a.owner, from: a.id, to: b.id, tt: 'camp', kind: 'raid', army: Object.assign(zeroArmy(), { knight: 2 }), dep: 0, arr: 60, fx: a.x, fy: a.y, tx: b.x, ty: b.y }); }
  DB.fitted = false; DB.W = 0;
  $('#start').hidden = false; renderStart();
}
function beginGame() {
  const f = U.form;
  S = makeWorld({ house: (f.house || '').trim() || 'House Aurelian', keep: (f.keep || '').trim() || 'King’s Square', rivals: f.rivals, diff: f.diff, pace: f.pace });
  herald(`${S.houses[0].name} founded ${S.keeps[0].name} on ${sq(S.keeps[0].x, S.keeps[0].y)}`, 'good');
  S.houses.slice(1).forEach(h => { const k = S.keeps.find(k => k.owner === h.id); herald(`${h.name} raised its banner over ${k.name} on ${sq(k.x, k.y)}`); });
  enterGame(); sfx('win');
  toast(`The truce lasts ${fmtT(S.truce / S.speed)}. Build fast.`, 'good');
}
function resumeGame() {
  S = loadSave(); if (!S) return showStart();
  const away = Math.min(3 * 3600, Math.max(0, (Date.now() - S.real) / 1000));
  const before = S.reports.length;
  if (away > 2) { SILENT = true; let g = away * S.speed; const step = Math.max(2, g / 3000); while (g > 0 && !S.over) { const d = Math.min(g, step); advance(d); g -= d; } SILENT = false; }
  enterGame();
  if (away > 60) toast(`Welcome back. ${fmtT(away)} passed${S.reports.length > before ? `, ${S.reports.length - before} new report${S.reports.length - before > 1 ? 's' : ''}` : ''}.`, 'good');
}
function enterGame() {
  $('#start').hidden = true; $('#app').hidden = false; U.view = 'keep'; GB.fitted = false; GB.W = 0;
  lastReal = Date.now(); render(); if (S.over) showEnd();
}
function showEnd() {
  const win = S.over === 'win', el = $('#end');
  const rows = S.houses.map(h => ({ h, s: score(h) })).sort((a, b) => b.s - a.s);
  el.innerHTML = `<div class="endbox ${win ? '' : 'lose'}"><div class="inner"><div class="label">${win ? 'The board is yours' : 'Your last keep has fallen'}</div><h1>${win ? 'Checkmate' : 'Resigned'}</h1>
    <p class="muted" style="margin:0">${win ? `${esc(S.houses[0].name)} took every rival keep after ${fmtT(S.gt)} of game time.` : `${esc(S.houses[0].name)} lasted ${fmtT(S.gt)} of game time.`} ${S.stats.wins} battles won, ${S.stats.captures} keeps captured.</p>
    <div class="card" style="width:100%;padding:6px 12px"><table class="stand"><tbody>${rows.map((r, i) => `<tr class="${r.h.human ? 'me' : ''}"><td>${i + 1}</td><td><span class="dot" style="background:${r.h.color}"></span> ${esc(r.h.name)}</td><td class="n">${fmt(r.s)}</td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn ghost" data-act="endview">View the board</button><button class="btn" data-act="again">New realm</button></div></div></div>`;
  el.hidden = false; save();
}

let lastReal = Date.now(), tickN = 0;
setInterval(() => {
  if (!S || $('#app').hidden) { lastReal = Date.now(); return; }
  const now = Date.now(); let dtR = (now - lastReal) / 1000; lastReal = now;
  if (!S.over) {
    dtR = Math.min(dtR, 3 * 3600);
    let g = dtR * S.speed; const big = g > 30; if (big) SILENT = true;
    const step = Math.max(1, g / 3000);
    while (g > 0 && !S.over) { const d = Math.min(g, step); advance(d); g -= d; }
    SILENT = false;
  }
  tickN++;
  renderHeader(); live();
  const busy = U.pdown || Date.now() - U.lastPtr < 600;
  const typing = document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName);
  if (tickN % 4 === 0 && !busy && !typing) {
    if (U.view !== 'board' && (U.isDirty || tickN % 8 === 0)) { const v = U.view; VIEWS[v] && render(); }
    else if (U.isDirty) { renderTabs(); U.isDirty = false; }
    if (U.sheet && U.sheet.t !== 'march') renderSheet();
    else if (U.sheet && U.sheet.t === 'march' && $('#mcSum')) $('#mcSum').innerHTML = mcSummary();
  }
  if (tickN % 20 === 0) save();
}, 250);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* boot */
const bootData = window.claude?.hot?.data;
window.claude?.hot?.snapshot?.(() => ({ save: S ? JSON.stringify(S) : null, view: U.view }));
function boot(d) {
  if (d && d.save) { try { S = JSON.parse(d.save); U.view = d.view || 'keep'; $('#start').hidden = true; $('#app').hidden = false; lastReal = Date.now(); render(); return; } catch (e) {} }
  showStart();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(bootData || {});
</script>
