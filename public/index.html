<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CheckRealm — is this website real?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="badge">🔍 CheckRealm</div>
        <h1>Is this website real?</h1>
        <p class="subtitle">
          Enter a URL and we'll check if it resolves, responds, and looks legit.
        </p>
      </header>

      <form id="check-form" class="check-form" autocomplete="off">
        <input
          id="url-input"
          name="url"
          type="text"
          inputmode="url"
          placeholder="example.com"
          aria-label="Website URL to check"
          required
        />
        <button id="check-button" type="submit">Check</button>
      </form>

      <section id="result" class="result" hidden aria-live="polite"></section>

      <footer class="footer">
        <span>Powered by the CheckRealm API</span>
      </footer>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
